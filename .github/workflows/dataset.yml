name: Refresh dataset

# Rebuilds data/countries.json from Wikidata (primary) and the World Bank
# (cross-check), and commits it when the tests still pass.
on:
  schedule:
    - cron: '17 4 * * 1' # every Monday
  workflow_dispatch:
  push:
    paths:
      - 'scripts/**'
      - '.github/workflows/dataset.yml'

permissions:
  contents: write

concurrency:
  group: dataset-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build dataset
        run: npm run data -- --strict
      - name: Validate
        run: npm test
      - name: Commit if changed
        run: |
          if git diff --quiet -- data/countries.json; then
            echo "Dataset unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/countries.json
          git commit -m "Refresh country dataset from Wikidata and World Bank"
          git push
